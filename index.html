<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Архив рода Девятковых</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>Архив рода Девятковых</h1>
<p>
Семейный архив семьи Девятковых — Герасимовых
</p>
</header>

<main>
<div class="stats">
<div class="stat">
<h2 id="countPeople">0</h2>
<span>Известных родственников</span>
</div>
<div class="stat">
<h2>2</h2>
<span>Репрессированных</span>
</div>
<div class="stat">
<h2>2</h2>
<span>Участника ВОВ</span>
</div>
<div class="stat">
<h2>5</h2>
<span>Известных населённых пунктов</span>
</div>
</div>

<input
id="search"
type="text"
placeholder="Поиск по фамилии, имени..."
oninput="render()"
>

<div class="actions">
<button onclick="showTree()">
🌳 Древо семьи
</button>
<button onclick="showTimeline()">
📜 История рода
</button>
<button onclick="showAbout()">
📖 О проекте
</button>
</div>

<div id="list"></div>
</main>

<div class="modal" id="modal">
<div class="window">
<div
class="close"
onclick="closeModal()"
>
✕
</div>
<div id="modalContent"></div>
</div>
</div>

<footer>
Архив рода Девятковых
<br><br>
Версия MVP v0.6
</footer>

<div id="treeModal" class="tree-modal">
<div class="tree-header">
<h2>🌳 Генеалогическое древо</h2>
<button onclick="closeTree()">
✕
</button>
</div>
<div id="treeContainer" class="tree-container">
</div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
